<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Flores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌸 Sistema de Gerenciamento de Flores</h1>
        </header>

        <!-- Formulário para adicionar/editar flores -->
        <div class="form-section">
            <h2>Adicionar Flor</h2>
            <form id="florForm">
                <input type="hidden" id="florId">
                <div class="form-group">
                    <label for="florNome">Nome da Flor:</label>
                    <input type="text" id="florNome" placeholder="Ex: Rosa" required>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <button type="button" class="btn btn-secondary" onclick="cancelarEdicao()">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- Lista de flores -->
        <div class="lista-section">
            <h2>Lista de Flores</h2>
            <div id="listaFlores" class="flores-grid">
                <!-- As flores serão carregadas aqui -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
